name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16.10
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres_ci_only
          POSTGRES_DB: tradex_dev
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -h 127.0.0.1 -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      # CI-only throwaway credentials for the service container above (no real secrets).
      TRADEX_OWNER_PASSWORD: tradex_owner_ci_only
      TRADEX_APP_PASSWORD: tradex_app_ci_only
      DATABASE_URL_TEST: postgresql://tradex_app:tradex_app_ci_only@127.0.0.1:5432/tradex_test
      DATABASE_URL_TEST_MIGRATE: postgresql://tradex_owner:tradex_owner_ci_only@127.0.0.1:5432/tradex_test
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 12.8.1

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install (frozen lockfile)
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Unit tests
        run: pnpm test

      - name: Create database roles and test database
        # Same script as the local dev compose; passwords come from TRADEX_*_PASSWORD above.
        run: psql "postgresql://postgres:postgres_ci_only@127.0.0.1:5432/tradex_dev" -f deploy/db-init/01-roles.sql

      - name: Integration tests
        run: pnpm test:integration

      - name: Build
        run: pnpm build

      - name: Install Playwright Chromium
        run: pnpm --filter web exec playwright install --with-deps chromium

      - name: Web e2e smoke
        run: pnpm --filter web e2e

      - name: Dependency audit (non-blocking until Phase 14)
        run: pnpm audit --prod
        continue-on-error: true

  secret-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Windows job for the Tally agent (.NET build and test) is added in Phase 05 (WP-05.0).
